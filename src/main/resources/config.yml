update-interval-seconds: 5

marker-set:
  id: folia-regions
  label: Folia Tick-Regionen
  default-hidden: true
  toggleable: true

markers:
  # Available placeholders:
  # {region_id}, {world}, {center_x}, {center_z}, {center_chunk_x}, {center_chunk_z},
  # {center_block_x}, {center_block_z}, {sections}, {chunks}, {area_blocks},
  # {entities}, {players}, {entities_per_chunk}, {players_per_chunk}, {updated_at}
  label-format: "Region[{center_x},{center_z}]"
  detail-format: |-
    <b>Folia-Region {region_id}</b><br>
    Welt: {world}<br>
    Zentrum: Chunk {center_chunk_x}, {center_chunk_z} / Block {center_block_x}, {center_block_z}<br>
    Sektionen: {sections}<br>
    Chunks: {chunks}<br>
    Regionsfl&auml;che: {area_blocks} Bl&ouml;cke&sup2;<br>
    Entit&auml;ten: {entities} ({entities_per_chunk}/Chunk)<br>
    Spieler: {players} ({players_per_chunk}/Chunk)<br>
    Aktualisiert: {updated_at}
  # Java DateTimeFormatter pattern, rendered in the server's local timezone
  timestamp-format: "yyyy-MM-dd HH:mm:ss z"
  height: 80
  # Hex format: #RRGGBB or #RRGGBBAA
  line-color: "#9b46ffff"
  fill-color: "#d2aaff59"
  line-width: 2
