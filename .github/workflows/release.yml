name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, for example v2.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and upload release JAR
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG_NAME="${RELEASE_TAG:-$INPUT_TAG}"
          if ! printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset_name=BlueMap-Folia-Regions-$VERSION.jar" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release JAR
        run: ./gradlew clean build -PreleaseVersion="${{ steps.release.outputs.version }}" --no-daemon

      - name: Prepare release asset
        run: |
          mkdir -p release
          cp "build/libs/${{ steps.release.outputs.asset_name }}" "release/${{ steps.release.outputs.asset_name }}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" "release/${{ steps.release.outputs.asset_name }}" --clobber
